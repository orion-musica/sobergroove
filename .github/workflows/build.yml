# SPDX-License-Identifier: GPL-3.0-only
# Build the Sober Groove firmware package on GitHub's servers: fetch JieLi's toolchain and the
# AC79 SDK, run the simulator tests, build the .fwsc, keep it as an artifact and, for a release,
# attach it to that release.
name: Build firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z or X.Y.Z-suffix)"
        default: "0.1.0-alpha"
        required: true
      attach_to:
        description: "Attach the package to this release tag (empty: artifact only)"
        default: "v0.1.0-alpha"
        required: false
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      X0X_FONTSET: terminus
      JIELI_TOOLCHAIN: ${{ github.workspace }}/tooling/jieli/toolchain
      AC79_SDK: ${{ github.workspace }}/tooling/ac79-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install -r requirements-build.txt

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"; V="${TAG#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"; TAG="${{ inputs.attach_to }}"
          else
            V="0.1.0-alpha"; TAG="v0.1.0-alpha"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Simulator tests
        run: sh tests/run_tests.sh

      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh "$PWD/tooling/jieli"

      - name: AC79 SDK
        run: git clone --branch AC79NN_SDK_V1.2.1_2023-12-13 --depth 1 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK tooling/ac79-sdk

      - name: Build the package
        env:
          PYTHON: python
        run: sh build.sh --release "${{ steps.v.outputs.version }}"

      - name: Checksums
        run: |
          cd build
          sha256sum sobergroove-*.fwsc omni.bin loader/ota.bin | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sobergroove-${{ steps.v.outputs.version }}
          path: |
            build/sobergroove-*.fwsc
            build/omni.bin
            build/loader/ota.bin
            build/SHA256SUMS.txt

      - name: Attach to the release
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.v.outputs.tag }}" build/sobergroove-*.fwsc build/SHA256SUMS.txt --clobber
          else
            echo "No release ${{ steps.v.outputs.tag }}: the package is in the run's artifacts."
          fi
